services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [devtrend_net]
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [devtrend_net]
    restart: unless-stopped

  frontend:
    build: ./frontend
    networks: [devtrend_net]
    restart: unless-stopped

  nginx:
    container_name: devtrend-nginx
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [frontend, backend]
    networks: [devtrend_net, public_net]
    restart: unless-stopped
  crawler:
    build:
      context: ./backend
      dockerfile: Dockerfile.crawler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      HEADLESS: "true"
    depends_on:
      db:
        condition: service_healthy
    networks: [devtrend_net]
    profiles: [batch]
    restart: "no"

volumes:
  postgres_data:

networks:
  devtrend_net:
  public_net:
    external: true
